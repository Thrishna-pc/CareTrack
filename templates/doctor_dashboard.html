<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Dashboard - CareTrack</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #ffffff;
            color: #385978;
            min-height: 100vh;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 112px;
            padding: 0 35px;

            background: linear-gradient(90deg, #123c9c, #1769e0);

            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-sizing: border-box;
            position: relative;
            overflow: hidden;

            box-shadow: 0 6px 20px rgba(18, 60, 156, 0.20);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
        }

        .logo-circle {
            width: 50px;
            height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(255,255,255,0.10);

            border: 1px solid rgba(255,255,255,0.25);

            box-shadow: 0 4px 12px rgba(0,50,120,0.15);
        }

        .logo-circle svg {
            width: 32px;
            height: 32px;
            display: block;
        }

        .brand span {
            font-size: 30px;
            font-weight: 700;
            color: white;
        }

        .header-right {
            color: white;
            font-size: 14px;
            font-weight: 400;

            display: flex;
            align-items: center;
            gap: 5px;
        }

        .user-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.10);

            border: 1px solid rgba(255, 255, 255, 0.25);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 19px;
        }

        /* ================= MAIN CONTAINER ================= */

        .container {
            max-width: 1250px;
            margin: auto;
            padding: 55px 45px 40px;
        }

        /* ================= WELCOME SECTION ================= */

        .welcome-section {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 45px;
        }

        .welcome-left {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        /* PROFESSIONAL DOCTOR ICON */

        .doctor-icon {
            width: 105px;
            height: 105px;

            border-radius: 50%;

            background: linear-gradient(145deg, #e5f5ff, #ffffff);

            display: flex;
            align-items: center;
            justify-content: center;

            color: #2479b8;
            font-size: 46px;

            box-shadow:
                0 8px 25px rgba(25,118,210,0.12),
                inset 0 0 0 1px #d4eaff;
        }

        h1 {
            margin: 0;

            color: #0587d7;

            font-size: 38px;
            font-weight: 750;

            letter-spacing: -0.5px;
        }

        .welcome {
            color: #60718d;

            margin-top: 8px;

            font-size: 17px;
        }

        /* ================= CARDS ================= */

        .cards {
            display: grid;

            grid-template-columns: repeat(2, minmax(0, 1fr));

            gap: 24px;

            max-width: 850px;

            margin: 0 auto;
        }

        .card {
            position: relative;

            min-height: 260px;

            padding: 32px;

            border-radius: 20px;

            text-decoration: none;

            color: #385978;

            overflow: hidden;

            border: 1px solid rgba(255,255,255,0.95);

            box-shadow:
                0 8px 25px rgba(50, 100, 130, 0.12);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .card::after {
            content: "";

            position: absolute;

            width: 150px;
            height: 150px;

            right: -55px;
            bottom: -65px;

            border-radius: 50%;

            opacity: 0.75;
        }

        .card:hover {
            transform: translateY(-6px);

            box-shadow:
                0 15px 32px rgba(50, 100, 130, 0.18);
        }

        /* ================= CARD BACKGROUNDS ================= */

        /* SOFT MINT PASTEL */

        .appointment-card {
            background: linear-gradient(
                135deg,
                #eef9f8,
                #f3d2e6
            );

            border-left: 5px solid #f05289;
        }

        .appointment-card::after {
            background: #e8c5d3;
        }

        /* SOFT LAVENDER PASTEL */

        .records-card {
            background: linear-gradient(
                135deg,
                #f5f1ff,
                #e7def8
            );

            border-left: 5px solid #9274d1;
        }

        .records-card::after {
            background: #dcd0f2;
        }

        /* ================= CARD ICONS ================= */

        .card-icon {
            width: 72px;
            height: 72px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;

            margin-bottom: 22px;

            position: relative;
            z-index: 2;
        }

        .appointment-icon {
            background: #d8f0e7;

            box-shadow:
                0 7px 16px rgba(70, 160, 125, 0.12);
        }

        .records-icon {
            background: #e6ddf7;

            box-shadow:
                0 7px 16px rgba(120, 90, 190, 0.12);
        }

        .card h3 {
            margin: 0 0 10px;

            color: #174a88;

            font-size: 24px;
            font-weight: 750;

            position: relative;
            z-index: 2;
        }

        .card p {
            margin: 0;

            color: #64748b;

            font-size: 16px;
            line-height: 1.6;

            max-width: 280px;

            position: relative;
            z-index: 2;
        }

        /* ================= ARROW BUTTON ================= */

        .card-arrow {
            position: absolute;

            right: 25px;
            bottom: 25px;

            width: 48px;
            height: 48px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            font-size: 25px;
            font-weight: bold;

            z-index: 3;

            box-shadow:
                0 6px 15px rgba(0,0,0,0.13);
        }

        .appointment-card .card-arrow {
            background: #98a955;
        }

        .records-card .card-arrow {
            background: #8062c4;
        }

        /* ================= LOGOUT ================= */

        .logout-container {
            text-align: center;

            margin-top: 45px;
        }

        .logout-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            padding: 14px 35px;

            background: linear-gradient(
                90deg,
                #123c9c,
                #1769e0
            );

            color: white;

            text-decoration: none;

            border-radius: 10px;

            font-weight: 700;
            font-size: 16px;

            box-shadow:
                0 8px 20px rgba(18, 60, 156, 0.25);

            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            transform: translateY(-3px);

            background: linear-gradient(
                90deg,
                #10358b,
                #125bc5
            );

            box-shadow:
                0 12px 25px rgba(18, 60, 156, 0.30);
        }

        .logout-icon {
            font-size: 21px;
        }

        /* ================= DECORATION ================= */

        .bottom-decoration {
            position: fixed;

            right: -40px;
            bottom: -55px;

            width: 230px;
            height: 230px;

            border-radius: 50%;

            background: rgba(92, 171, 244, 0.10);

            z-index: -1;
        }

        .heart-decoration {
            position: fixed;

            left: -70px;
            bottom: -80px;

            width: 240px;
            height: 240px;

            border-radius: 50%;

            background: rgba(93, 175, 244, 0.07);

            z-index: -1;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {

            .cards {
                grid-template-columns: 1fr;
                max-width: 500px;
            }

            .welcome-section {
                flex-direction: column;

                align-items: flex-start;

                gap: 25px;
            }

        }

        @media (max-width: 600px) {

            .navbar {
                height: auto;
                min-height: 85px;

                padding: 16px 20px;
            }

            .brand span {
                font-size: 23px;
            }

            .header-right {
                display: none;
            }

            .container {
                padding: 35px 20px;
            }

            .welcome-left {
                align-items: flex-start;
            }

            .doctor-icon {
                width: 75px;
                height: 75px;

                font-size: 40px;
            }

            h1 {
                font-size: 27px;
            }

            .card {
                min-height: 240px;

                padding: 25px;
            }

        }

    </style>

</head>

<body>


<!-- ================= NAVBAR ================= -->

<div class="navbar">

    <div class="brand">

        <div class="logo-circle">

            <svg viewBox="0 0 64 64"
                 xmlns="http://www.w3.org/2000/svg">

                <path
                    d="M32 52
                       C29 49 14 39 10 29
                       C6 19 12 12 21 12
                       C27 12 31 16 32 20
                       C33 16 37 12 43 12
                       C52 12 58 19 54 29
                       C50 39 35 49 32 52Z"
                    fill="none"
                    stroke="white"
                    stroke-width="3"
                    stroke-linejoin="round"/>

                <polyline
                    points="15,30 23,30 27,24 31,36 35,27 39,30 49,30"
                    fill="none"
                    stroke="white"
                    stroke-width="3"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>

            </svg>

        </div>

        <span>CareTrack</span>

    </div>

    <div class="header-right">
        Healthcare Management System
        <span class="user-icon">
            ♙
        </span>
    </div>

</div>


<!-- ================= MAIN CONTENT ================= -->

<div class="container">


    <!-- ================= WELCOME ================= -->

    <div class="welcome-section">

        <div class="welcome-left">

            <div class="doctor-icon">
                <i class="fa-solid fa-user-doctor"></i>
            </div>

            <div>

                <h1>
                    Welcome, {{ session["name"] }}
                </h1>

                <div class="welcome">
                    Doctor Management Panel
                </div>

            </div>

        </div>

    </div>


    <!-- ================= CARDS ================= -->

    <div class="cards">


        <!-- APPOINTMENTS -->

        <a href="/doctor_appointments"
           class="card appointment-card">

            <div class="card-icon appointment-icon">
                📅
            </div>

            <h3>
                Appointments
            </h3>

            <p>
                View patient appointments.
            </p>

            <div class="card-arrow">
                →
            </div>

        </a>


        <!-- MEDICAL RECORDS -->

        <a href="/doctor_medical_records"
           class="card records-card">

            <div class="card-icon records-icon">
                📋
            </div>

            <h3>
                Medical Records
            </h3>

            <p>
                View patient medical records.
            </p>

            <div class="card-arrow">
                →
            </div>

        </a>


    </div>


    <!-- ================= LOGOUT ================= -->

    <div class="logout-container">

        <a href="/logout"
           class="logout-btn">

            <span class="logout-icon">
                🚪
            </span>

            Logout

        </a>

    </div>

</div>


<!-- ================= DECORATIVE BACKGROUND ================= -->

<div class="bottom-decoration"></div>

<div class="heart-decoration"></div>


</body>

</html>
