<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CareTrack Login</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: #eef6ff;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;
}


/* MAIN BOX */

.login-container {

    width: 100%;
    max-width: 1050px;
    min-height: 620px;

    background: white;

    border-radius: 22px;

    overflow: hidden;

    display: grid;

    grid-template-columns: 1fr 1fr;

    box-shadow:
        0 12px 40px rgba(0, 80, 160, 0.16);
}


/* LEFT IMAGE */

.image-section {

    min-height: 620px;

    background: #eaf5ff;

    overflow: hidden;
}

.image-section img {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* RIGHT LOGIN */

.login-section {

    padding: 45px 55px;

    display: flex;

    flex-direction: column;

    justify-content: center;
}


/* CARETRACK LOGO */

.logo {

    text-align: center;

    margin-bottom: 4px;
}

.logo-icon {

    width: 42px;
    height: 42px;

    vertical-align: middle;

    margin-right: 8px;
}

.logo-text {

    font-size: 35px;

    font-weight: bold;

    color: #12345b;

    vertical-align: middle;
}

.logo-text span {

    color: #0d6efd;
}


.subtitle {

    text-align: center;

    color: #64748b;

    font-size: 14px;

    margin-bottom: 18px;
}


/* WELCOME */

.welcome {

    text-align: center;

    color: #0f766e;

    font-size: 18px;

    font-weight: 600;

    margin-bottom: 6px;
}


/* SIGN IN */

.login-title {

    text-align: center;

    color: #102a43;

    font-size: 27px;

    font-weight: bold;

    margin-bottom: 28px;
}


/* ERROR MESSAGE */

.message {

    background: #fff1f2;

    color: #dc2626;

    border: 1px solid #fecaca;

    padding: 12px;

    border-radius: 9px;

    text-align: center;

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 20px;
}


/* SUCCESS MESSAGE */

.success-message {

    background: #ecfdf3;

    color: #198754;

    border: 1px solid #b7e4c7;

    padding: 12px;

    border-radius: 9px;

    text-align: center;

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 20px;
}


/* LOGIN AS */

.role-title {

    color: #0f766e;

    font-size: 15px;

    font-weight: bold;

    margin-bottom: 10px;
}


/* ROLE BUTTONS */

.roles {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 10px;

    margin-bottom: 22px;
}


.role-btn {

    height: 54px;

    border: 2px solid #b8d8ff;

    border-radius: 9px;

    background: white;

    color: #1769c2;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 9px;
}


.role-btn:hover {

    background: #f1f7ff;

    border-color: #0d6efd;
}


/* SELECTED */

.role-btn.active {

    background: #0d6efd;

    color: white;

    border-color: #0d6efd;
}


/* ROLE ICON */

.role-icon {

    width: 25px;

    height: 25px;

    stroke: currentColor;

    fill: none;

    stroke-width: 2;

    stroke-linecap: round;

    stroke-linejoin: round;
}


/* INPUT BOX */

.input-box {

    position: relative;

    margin-bottom: 15px;
}


.input-icon {

    position: absolute;

    left: 16px;

    top: 50%;

    transform: translateY(-50%);

    width: 22px;

    height: 22px;

    color: #1769c2;

    stroke: currentColor;

    fill: none;

    stroke-width: 2;

    stroke-linecap: round;

    stroke-linejoin: round;

    pointer-events: none;
}


input {

    width: 100%;

    height: 52px;

    padding: 0 16px 0 50px;

    border: 1px solid #d1dbe8;

    border-radius: 9px;

    font-size: 15px;

    outline: none;

    background: #fbfdff;
}


input:focus {

    border-color: #0d6efd;

    background: white;

    box-shadow:
        0 0 0 3px rgba(13, 110, 253, 0.08);
}


/* LOGIN BUTTON */

.login-btn {

    width: 100%;

    height: 52px;

    border: none;

    border-radius: 9px;

    background: #0d6efd;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;
}


.login-btn:hover {

    background: #0b5ed7;
}


.login-icon {

    width: 22px;

    height: 22px;

    stroke: currentColor;

    fill: none;

    stroke-width: 2;

    stroke-linecap: round;

    stroke-linejoin: round;
}


/* REGISTER */

.register {

    display: none;

    text-align: center;

    margin-top: 20px;

    padding-top: 17px;

    border-top: 1px solid #e5edf5;

    color: #64748b;

    font-size: 14px;
}


.register a {

    color: #0d6efd;

    font-weight: bold;

    text-decoration: none;

    margin-left: 4px;
}


.register a:hover {

    text-decoration: underline;
}


/* FOOTER */

.footer {

    text-align: center;

    color: #94a3b8;

    font-size: 12px;

    margin-top: 25px;
}


/* MOBILE */

@media (max-width: 800px) {

    .login-container {

        grid-template-columns: 1fr;

        max-width: 500px;
    }

    .image-section {

        min-height: 250px;

        max-height: 280px;
    }

    .login-section {

        padding: 40px 28px;
    }

}


@media (max-width: 420px) {

    .roles {

        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<div class="login-container">


    <!-- LEFT SIDE IMAGE -->

    <div class="image-section">

        <img
            src="{{ url_for('static', filename='caretrack-healthcare-image.jpg') }}"
            alt="CareTrack Healthcare"
        >

    </div>



    <!-- RIGHT LOGIN -->

    <div class="login-section">


        <!-- CARETRACK LOGO -->

        <div class="logo">

            <!-- Two-tone CareTrack heart logo -->

            <svg
                class="logo-icon"
                viewBox="0 0 64 64"
                xmlns="http://www.w3.org/2000/svg"
            >

                <defs>

                    <linearGradient
                        id="heartGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%"
                    >

                        <stop
                            offset="50%"
                            stop-color="#0757b8"
                        />

                        <stop
                            offset="50%"
                            stop-color="#19c3e6"
                        />

                    </linearGradient>

                </defs>

                <path
                    d="M32 55
                       C28 50 8 36 8 21
                       C8 12 14 7 22 7
                       C27 7 31 10 32 14
                       C33 10 37 7 42 7
                       C50 7 56 12 56 21
                       C56 36 36 50 32 55Z"
                    fill="none"
                    stroke="url(#heartGradient)"
                    stroke-width="5"
                />

                <path
                    d="M32 17 V31
                       M25 24 H39"
                    stroke="#0757b8"
                    stroke-width="5"
                    stroke-linecap="round"
                />

            </svg>


            <span class="logo-text">
                Care<span>Track</span>
            </span>

        </div>


        <div class="subtitle">
            Healthcare Management System
        </div>


        <div class="welcome">
            Welcome to CareTrack
        </div>


        


        <!-- MESSAGE -->

        {% if message %}

            <div class="{% if success %}success-message{% else %}message{% endif %}">
                {{ message }}
            </div>

        {% endif %}



        <!-- LOGIN AS -->

        <div class="role-title">
            Login As
        </div>


        <div class="roles">


            <!-- ADMIN -->

            <button
                type="button"
                class="role-btn"
                onclick="selectRole('admin', this)"
            >

                <svg
                    class="role-icon"
                    viewBox="0 0 24 24"
                >

                    <circle
                        cx="12"
                        cy="7"
                        r="4"
                    />

                    <path
                        d="M4 21
                           C4 16.5 7.5 14 12 14
                           C16.5 14 20 16.5 20 21"
                    />

                </svg>

                Admin

            </button>



            <!-- DOCTOR -->

            <button
    type="button"
    class="role-btn"
    onclick="selectRole('doctor', this)"
>
    <svg
        width="25"
        height="25"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        style="vertical-align: middle; margin-right: 8px;"
    >
        <path d="M6 3v6a6 6 0 0 0 12 0V3"></path>
        <path d="M6 3H4"></path>
        <path d="M18 3h2"></path>
        <path d="M12 15v3"></path>
        <circle cx="12" cy="20" r="2"></circle>
    </svg>
    Doctor
</button>


            <!-- PATIENT -->

            <button
                type="button"
                class="role-btn"
                onclick="selectRole('patient', this)"
            >

                <svg
                    class="role-icon"
                    viewBox="0 0 24 24"
                >

                    <circle
                        cx="12"
                        cy="7"
                        r="3"
                    />

                    <circle
                        cx="5"
                        cy="10"
                        r="2.5"
                    />

                    <circle
                        cx="19"
                        cy="10"
                        r="2.5"
                    />

                    <path
                        d="M7 21
                           C7 17
                           9 15
                           12 15
                           C15 15
                           17 17
                           17 21"
                    />

                    <path
                        d="M1 20
                           C1 17
                           3 15
                           5 15
                           C6 15 7 15.5 8 16"
                    />

                    <path
                        d="M23 20
                           C23 17
                           21 15
                           19 15
                           C18 15 17 15.5 16 16"
                    />

                </svg>

                Patient

            </button>


        </div>



        <!-- LOGIN FORM -->

        <form
            method="POST"
            onsubmit="return checkRole()"
        >


            <input
                type="hidden"
                name="role"
                id="role"
                value=""
            >


            <!-- EMAIL -->

            <div class="input-box">

                <svg
                    class="input-icon"
                    viewBox="0 0 24 24"
                >

                    <rect
                        x="3"
                        y="5"
                        width="18"
                        height="14"
                        rx="2"
                    />

                    <path
                        d="M3 7
                           L12 13
                           L21 7"
                    />

                </svg>


                <input
                    type="email"
                    name="username"
                    placeholder="Enter your email"
                    required
                >

            </div>



            <!-- PASSWORD -->

            <div class="input-box">

                <svg
                    class="input-icon"
                    viewBox="0 0 24 24"
                >

                    <rect
                        x="5"
                        y="10"
                        width="14"
                        height="11"
                        rx="2"
                    />

                    <path
                        d="M8 10
                           V7
                           C8 4 16 4 16 7
                           V10"
                    />

                    <circle
                        cx="12"
                        cy="15"
                        r="1"
                    />

                </svg>


                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>



            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn"
            >

                <svg
                    class="login-icon"
                    viewBox="0 0 24 24"
                >

                    <path
                        d="M10 17
                           L15 12
                           L10 7"
                    />

                    <path
                        d="M15 12
                           H3"
                    />

                    <path
                        d="M21 3
                           V21"
                    />

                </svg>

                Login

            </button>


        </form>



        <!-- PATIENT REGISTER -->

        <div
            class="register"
            id="registerSection"
        >

            New Patient?

            <a href="/patients">
                Register Here →
            </a>

        </div>



        <div class="footer">
            CareTrack © 2026
        </div>


    </div>

</div>



<script>


function selectRole(role, button) {


    /* Set selected role */

    document.getElementById("role").value = role;


    /* Remove active from all */

    let buttons =
        document.querySelectorAll(".role-btn");


    buttons.forEach(function(btn) {

        btn.classList.remove("active");

    });


    /* Make selected button blue */

    button.classList.add("active");


    /* Register only for Patient */

    let registerSection =
        document.getElementById("registerSection");


    if (role === "patient") {

        registerSection.style.display = "block";

    }

    else {

        registerSection.style.display = "none";

    }

}


function checkRole() {


    let role =
        document.getElementById("role").value;


    if (role === "") {

        alert(
            "Please select Admin, Doctor or Patient."
        );

        return false;

    }


    return true;

}

</script>


</body>

</html>
